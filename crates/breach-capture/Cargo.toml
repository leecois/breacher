[package]
name = "breach-capture"
description = "Screen capture for the breach reader: finds the game window, checks permission, grabs one frame"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
xcap = { version = "0.9", features = ["wgc"] }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows-version = "0.1.7"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
