name: release

# builds the installer, the portable program and the update manifest and attaches them, with the command-line tool, to a draft release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach the files to
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # no release unless the reader reads the whole corpus exactly on this machine too
      - name: Reader and solver tests
        run: cargo test --release -p breach-core

      # reported, not required: these touch the machine's windows and system files
      - name: Capture tests
        continue-on-error: true
        run: cargo test -p breach-capture -- --nocapture

      - name: Command-line tool
        run: cargo build --release -p breach-cli

      - name: Corpus through the command-line tool
        run: cargo run --release -p breach-cli -- eval corpus/cpah

      # the installer is signed so that installed copies accept it as an update
      - name: Installer
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          npm ci
          npm run tauri build -- --bundles nsis

      # reported, not required: the hosted machine's desktop session is not the player's
      - name: Desktop self-test
        shell: bash
        timeout-minutes: 3
        continue-on-error: true
        env:
          BREACHER_CONFIG: selftest/settings.json
          BREACHER_SELFTEST: corpus/cpah/0.png
          BREACHER_SELFTEST_AUTOSTART: 1
        run: |
          ./target/release/breacher.exe > selftest.txt 2>&1 || echo "exit code $?"
          cat selftest.txt selftest/breacher.log
          grep -q "ok 6x6" selftest/breacher.log

      - name: Collect files
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir out
          cp target/release/bundle/nsis/*-setup.exe out/
          setup=$(basename out/*-setup.exe)
          cp target/release/breacher.exe "out/${setup%-setup.exe}-portable.exe"
          cp target/release/breach.exe out/breach-cli.exe
          node app/scripts/update-manifest.mjs "$TAG" "target/release/bundle/nsis/$setup" out/latest.json
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: breacher-windows
          path: out/

      - name: Attach to a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --prerelease --verify-tag --title "Breacher $TAG" --notes-file docs/RELEASE-NOTES.md
          gh release upload "$TAG" out/* --clobber
